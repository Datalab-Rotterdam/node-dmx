name: Bug report
description: Something in node-dmx doesn't work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the [Troubleshooting](https://github.com/Datalab-Rotterdam/node-dmx#troubleshooting) section and [existing issues](https://github.com/Datalab-Rotterdam/node-dmx/issues) first.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest code snippet that shows the problem.
      render: ts
      placeholder: |
        import {DMXController} from 'node-dmx';

        const controller = new DMXController({protocol: 'sacn'});
        controller.setChannel(1, 1, 255);
        await controller.flush();
    validations:
      required: true

  - type: dropdown
    id: protocol
    attributes:
      label: Protocol
      multiple: true
      options:
        - sACN (E1.31)
        - Art-Net
        - RDM over Art-Net
        - RDMnet (E1.33)
        - LLRP
        - Fixtures / plugins
        - Other / not protocol-specific
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: node-dmx version
      placeholder: "1.3.0"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "22.11.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: Devices and network
      description: Console, node or fixture on the other end (make/model/firmware), and your network setup (wired/Wi-Fi, switch, multiple interfaces, unicast/multicast/broadcast).
      placeholder: "ENTTEC ODE Mk3 (fw 1.2) via a managed switch, laptop has Wi-Fi + Ethernet"

  - type: textarea
    id: logs
    attributes:
      label: Logs, errors and packet captures
      description: Paste error output or stack traces. A Wireshark capture (`.pcapng`) is very helpful for network issues; you can attach it as a zip.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this hasn't been reported yet.
          required: true
        - label: I'm using the latest version of node-dmx.
